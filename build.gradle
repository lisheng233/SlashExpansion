plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ==================================================================
// 依赖仓库
// ==================================================================
// 注意：官方 maven.neoforged.net 在部分网络环境下会被 DNS 污染（解析到无关 IP，
// 443 直接不通），NeoForm 与 NeoForge 构件都取不到，构建会卡死或失败。
// 因此这里默认把 net.neoforged 的依赖重写到 BMCLAPI 镜像；
// 网络正常的环境用 -PneoforgeMirror= 关掉重写即可。
def mirrorUrl = (findProperty('neoforgeMirror') ?: 'https://bmclapi2.bangbang93.com/maven').toString()
boolean useMirror = !mirrorUrl.isBlank()

repositories {
    if (useMirror) {
        maven {
            name = 'NeoForgeMirror'
            url = mirrorUrl
        }
    }
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

if (useMirror) {
    // moddev 插件会自己往 project 上挂官方仓库，这里统一改写到镜像
    repositories.all { repo ->
        if (repo instanceof MavenArtifactRepository
                && repo.url.toString().contains('maven.neoforged.net')) {
            repo.url = uri(mirrorUrl)
        }
    }
}

dependencies {
    // 拔刀剑：重锋（1.21.1 / NeoForge）
    implementation "maven.modrinth:slashblade-resharped:${slashblade_version}"
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// runData 输出挂进资源源集，随 jar 打包（勿手动改 generated 文件）。
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 只在 neoforge.mods.toml 上做占位符展开，其它资源文件原样复制。
// 注意：expand 底层是 Groovy 模板引擎，会把它看到的任何「美元号+花括号」片段
// 当作表达式求值——资源文件里出现非占位符的该类写法会让构建以模板解析失败报错。
processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand project.properties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
